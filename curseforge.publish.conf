# Config for scripts/publish-curseforge.sh — see scripts/curseforge.publish.conf.example
# for a full explanation of every field.

CF_PROJECT_ID=""            # TODO: fill in the Botania Ponder CurseForge project id
CF_PROJECT_SLUG=""          # TODO: e.g. "botania-ponder", used only for the printed link

CF_MC_VERSIONS=""   # auto-detected from gradle.properties
CF_MOD_LOADERS=""   # auto-detected from build.gradle
CF_JAVA_VERSIONS=""

CF_RELEASE_TYPE="release"
CF_TAG_PREFIX="v"

CF_JAR_GLOB="build/libs/botania_ponder-{version}.jar"
CF_JAR_EXCLUDE_PATTERN="-(sources|dev|shadow|api)\.jar$"

CF_CHANGELOG_FILE="CHANGELOG.md"
CF_CHANGELOG_TYPE="markdown"

CF_DISPLAY_NAME_TEMPLATE="{mod_name} {version}"
CF_MOD_NAME=""

CF_BUILD_COMMAND=""
CF_STATE_FILE=".curseforge-published.json"
